[package]
name = "fw-stm32"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "fw-stm32"
test = false
bench = false

[dependencies]
transictrl-hal = { path = "../../crates/hal" }
transictrl-722 = { path = "../../crates/transictrl-722" }
heapless = "0.8"

[target.'cfg(target_arch = "arm")'.dependencies]
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5"
embassy-sync = "0.8"
embassy-stm32 = { version = "0.5", features = ["stm32f407vg", "time-driver-any", "exti", "memory-x"] }

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "0.2"
critical-section = "1.2"

[features]
default = []
